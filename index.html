<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050614">
<title>星光生日夜</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#fff3fc;background:#050614}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 55%,#171535,#090b20 52%,#050614 85%)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{min-height:100dvh;display:grid;place-items:center;padding:20px}
.panel{z-index:1;text-align:center;width:min(100%,415px);padding:26px 22px;background:#10122ce8;border:1px solid #c7c8ff55;border-radius:24px;box-shadow:0 12px 60px #030410aa}
h1,h2,p{margin:0 0 14px}h1{font-size:clamp(1.55rem,4.5vw,2.4rem)}p{line-height:1.65;color:#e4ddf9}
button,input{font:inherit;border-radius:30px;border:1px solid #b6b6ff70;color:inherit;background:#191b3c;padding:10px 15px;min-height:44px}
button{cursor:pointer}button.primary{background:#f1deff;color:#25183d;border-color:transparent;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid #84e6ff;outline-offset:3px}
input{width:70px;text-align:center}label{display:inline-flex;align-items:center;gap:8px;margin:4px}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.dock{position:fixed;inset:auto 12px max(14px,env(safe-area-inset-bottom));text-align:center;z-index:2}
.dock p{margin-bottom:5px;font-size:.85rem}
.controls{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:3}
.controls button{min-height:36px;padding:5px 12px;font-size:.83rem}
#cakeTitle{position:fixed;top:clamp(55px,10dvh,110px);left:10px;right:10px;text-align:center;z-index:1;pointer-events:none;text-shadow:0 0 30px #9f7cff}
#card{position:fixed;bottom:14%;left:50%;transform:translateX(-50%);padding:18px 20px}
#card h2{color:#fff;font-size:1.2rem}#card p{font-size:.94rem;margin-bottom:12px}
#counter{position:fixed;inset:0;display:grid;place-items:center;font:bold clamp(7rem,24vw,15rem)/1 Georgia,serif;pointer-events:none;color:#f8eaff;text-shadow:0 0 46px #6aa9ff;z-index:1}
[hidden]{display:none!important}
</style>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="controls"><button id="music" aria-pressed="false">开启音乐</button></div>
<main>
<form id="invite" class="panel">
<h1>有一份生日惊喜</h1><p>输入你的生日，打开星光。</p>
<label>月 <input id="month" type="number" inputmode="numeric" min="1" max="12" required></label>
<label>日 <input id="day" type="number" inputmode="numeric" min="1" max="31" required></label>
<div class="actions"><button class="primary">开启生日惊喜</button></div>
<p id="error" role="status" hidden>日期不对，再试一次。</p>
</form>
<div id="counter" role="status" hidden></div>
<h1 id="cakeTitle" hidden>生日快乐！</h1>
<div id="wish" class="dock" hidden><p id="micStatus" role="status">许个愿，再吹灭蜡烛。</p>
<div class="actions"><button id="blow">开启吹蜡烛</button><button id="tap" class="primary">点一下也能许愿</button></div></div>
<section id="card" class="panel" hidden><h2>生日快乐</h2><p>愿新的一岁，开心的事多一点。<br>愿你一直有喜欢的事，也有奔向它们的勇气。<br>愿你平安顺遂，自在明亮。</p><button id="stars">收下祝福</button></section>
<section id="end" class="panel" hidden><h1>愿你自在明亮</h1><p>生日快乐，愿新的一岁有很多值得记住的瞬间。</p><button id="replay" class="primary">重看一次</button></section>
</main>
<script>
'use strict';

// 改这里可设置生日、辉光和星尘预算。音乐可填同目录音频文件名。
const settings = { month:12, day:6, glow:1.33, orbitSpeed:1, cakeTurnSeconds:18, musicUrl:'', starCount:1350 };
const byId = id => document.getElementById(id);
const canvas = byId('scene'), ctx = canvas.getContext('2d');
const tau = Math.PI*2;
const colors = ['#b4edff','#54a8ff','#ff9be2','#ffcfef','#fffaff'];
const cakeTop = -.40;
const cakeBottom = .50;
const viewTilt = .32;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = x => Math.max(0,Math.min(1,x));
const smooth = x => { x=clamp(x); return x*x*(3-2*x); };
const lerp = (a,b,t) => a+(b-a)*t;

function randomGenerator(seed) {
  return () => { seed=(Math.imul(1664525,seed)+1013904223)>>>0; return seed/4294967296; };
}
const random = randomGenerator(1519);
const worldStars = Array.from({length:230},()=>[random(),random(),random(),random()]);
const ornaments = Array.from({length:530},(_,i)=>({
  x:random(),y:random(),z:random(),phase:random()*tau,
  color:colors[i%colors.length],size:random(),kind:random()
}));
const stars = Array.from({length:settings.starCount},(_,i)=>({
  arm:i%5, travel:random(), offset:(random()+random()-1), phase:random()*tau,
  size:random(), color:colors[i%5], ox:random(), oy:random()
}));
let width,height,ratio,stage='invite',started=0,raf,lastNumber,cardBox,extinguished=0;
let cakeRevealedAt = 0;
let stream, micAudio, micFrame, micRequest=0, audioCtx, musicOn=false, noteTimer=0;
const song = settings.musicUrl ? new Audio(settings.musicUrl) : null;
if(song){song.loop=true;song.volume=.28;}
const sprites = new Map();
for(const color of colors){
  const sprite=document.createElement('canvas');sprite.width=sprite.height=64;
  const draw=sprite.getContext('2d'), gradient=draw.createRadialGradient(32,32,0,32,32,32);
  gradient.addColorStop(0,'white');gradient.addColorStop(.13,color);gradient.addColorStop(.30,color+'88');gradient.addColorStop(1,color+'00');
  draw.fillStyle=gradient;draw.fillRect(0,0,64,64);sprites.set(color,sprite);
}

function resize(){
  width=window.innerWidth;height=window.innerHeight;ratio=Math.min(devicePixelRatio||1,width<650?1.5:2);
  canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
}
function ellipse(x,y,rx,ry,fill){
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,tau);ctx.fillStyle=fill;ctx.fill();
}
function sparkle(x,y,r,color,alpha,shape=0){
  ctx.globalAlpha=clamp(alpha);
  ctx.fillStyle=color;
  if(r<1.05){ctx.fillRect(x-r,y-r,2*r,2*r);return;}
  if(shape){
    ctx.beginPath();
    const points=shape===2?10:8;
    for(let i=0;i<points;i++){
      const a=i*tau/points-Math.PI/2, rr=i%2?r*.29:r;
      const px=x+rr*Math.cos(a),py=y+rr*Math.sin(a);
      if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);
    }
    ctx.closePath();ctx.fill();
  }else{ellipse(x,y,r,r,color);}
}
function glow(x,y,r,color,alpha){
  ctx.globalAlpha=clamp(alpha*settings.glow);
  ctx.drawImage(sprites.get(color),x-r,y-r,r*2,r*2);
}
function layout(){
  const r=Math.min(width*.306,height*.205,214);
  const raised=stage==='card'||stage==='gather';
  return {x:width/2,y:height*(raised?.45:.55),r:raised?r*.8:r};
}
function background(time){
  for(const [x,y,weight,phase] of worldStars){
    const twinkle=.64+.36*Math.sin(time*.9+phase*tau);
    const px=x*width,py=y*height;
    if(weight>.98)glow(px,py,6,colors[0],.33*twinkle);
    sparkle(px,py,.24+weight*.65,colors[Math.floor(phase*5)],.12+twinkle*weight*.52);
  }
  ctx.globalAlpha=1;
}
function cylinderPath(r,top,bottom){
  ctx.beginPath();ctx.moveTo(-r,top);ctx.lineTo(-r,bottom);
  ctx.ellipse(0,bottom,r,viewTilt*r,0,Math.PI,0,true);ctx.lineTo(r,top);
  ctx.ellipse(0,top,r,viewTilt*r,0,0,Math.PI);ctx.closePath();
}
function orbitShapes(time,front,alpha){
  for(let band=0;band<3;band++){
    const tilt=[-.21,.26,-.5][band], radius=[1.27,1.31,1.19][band];
    ctx.save();ctx.rotate(tilt);ctx.globalAlpha=.20*alpha;ctx.strokeStyle=colors[band];ctx.lineWidth=.008;
    ctx.beginPath();ctx.ellipse(0,-.67,radius,1.11,0,front?0:Math.PI,front?Math.PI:tau);ctx.stroke();
    for(let i=0;i<68;i++){
      const drift=reduced?0:time*(.022+band*.009)*settings.orbitSpeed;
      const a=(i/68+drift+band*.15)%1*tau;
      if((a<Math.PI)!==front)continue;
      const x=radius*Math.cos(a),y=-.67+1.11*Math.sin(a);
      if(i%17===0)glow(x,y,.085,colors[i%5],.68*alpha);
      sparkle(x,y,i%17===0?.025:.006,colors[i%5],(.30+(i%9)/13)*alpha,i%17===0?1:0);
    }
    ctx.restore();
  }
}
// Orthographic projection around the cake's vertical axis. Depth determines
// which decorations are on the front, so they disappear behind the cylinder.
function cakePoint(angle, radius, height){
  const depth=Math.cos(angle);
  return {x:Math.sin(angle)*radius,y:height+viewTilt*radius*depth,depth};
}
function cakeAngle(time){
  return -.39+(reduced?0:Math.max(0,time-cakeRevealedAt)*tau/settings.cakeTurnSeconds);
}
function cakeCandy(x,y,size,color,alpha,isStar){
  if(size>.025)glow(x,y,size*3.4,color,alpha*.86);
  ctx.globalAlpha=alpha;
  if(isStar){
    ctx.beginPath();
    for(let k=0;k<10;k++){
      const a=k*tau/10-Math.PI/2;
      const radius=k%2?size*.43:size;
      const px=x+radius*Math.cos(a),py=y+radius*Math.sin(a);
      if(k)ctx.lineTo(px,py);else ctx.moveTo(px,py);
    }
    ctx.closePath();ctx.fillStyle=color;ctx.fill();
    ellipse(x,y,size*.17,size*.17,'#fff');
  }else{
    ellipse(x,y,size,size,color);
    ctx.globalAlpha=alpha*.9;
    ellipse(x-size*.25,y-size*.27,size*.30,size*.25,'#fff');
  }
}
function cakeLettering(yaw,alpha){
  ctx.font='.097px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const [i,letter] of [...'happy birthday'].entries()){
    const point=cakePoint(yaw+(i-6.5)*.053,1,.13);
    if(point.depth<=0)continue;
    ctx.save();ctx.translate(point.x,point.y);ctx.scale(Math.max(.05,point.depth),1);
    ctx.globalAlpha=alpha*smooth(point.depth*3);
    ctx.fillStyle='#fff4fb';ctx.fillText(letter,0,0);ctx.restore();
  }
}
function drawCake(time,alpha=1){
  const {x,y,r}=layout(), yaw=cakeAngle(time);
  ctx.save();ctx.translate(x,y);ctx.scale(r,r);
  glow(0,.68,1.53,colors[1],.47*alpha);
  orbitShapes(time,false,alpha);
  ctx.globalAlpha=alpha;
  const plate=ctx.createLinearGradient(0,.34,0,.96);
  plate.addColorStop(0,'#a5b7ff');plate.addColorStop(.55,'#fef8ff');plate.addColorStop(.83,'#fff');plate.addColorStop(1,'#78a8ff');
  ellipse(0,.59,1.29,.375,'#5285f9');
  ellipse(0,.55,1.30,.37,plate);
  ellipse(0,.54,1.17,.33,'#d6e0ff');
  for(let i=0;i<62;i++){
    const p=ornaments[140+i], point=cakePoint(p.x*tau+yaw,1.1+p.y*.14,.55);
    cakeCandy(point.x,point.y,.004+p.size**2*.021,p.color,alpha*.82,i%9===0);
  }
  ctx.globalAlpha=alpha;
  const glaze=ctx.createLinearGradient(-1,0,1,0);
  glaze.addColorStop(0,'#5acaff');glaze.addColorStop(.09,'#2858a9');
  glaze.addColorStop(.32,'#171e54');glaze.addColorStop(.60,'#0c1235');
  glaze.addColorStop(.88,'#202d76');glaze.addColorStop(1,'#72b6ff');
  cylinderPath(1,cakeTop,cakeBottom);ctx.fillStyle=glaze;ctx.fill();
  ctx.save();ctx.clip();
  const highlight=cakePoint(yaw+1.23,1,0);
  if(highlight.depth>0){
    const reflected=ctx.createLinearGradient(highlight.x-.19,0,highlight.x+.19,0);
    reflected.addColorStop(0,'#aceaff00');reflected.addColorStop(.48,'#aceaff85');reflected.addColorStop(1,'#aceaff00');
    ctx.globalAlpha=alpha*highlight.depth;ctx.fillStyle=reflected;ctx.fillRect(highlight.x-.19,cakeTop,.38,1.25);
  }
  for(const [i,p] of ornaments.entries()){
    const point=cakePoint(p.x*tau+yaw,1,lerp(cakeTop+.045,cakeBottom-.035,p.y));
    if(point.depth<=0)continue;
    const edgeFade=smooth(point.depth*3.5);
    const size=(.003+p.size**5*.041)*(.67+point.depth*.33);
    cakeCandy(point.x,point.y,size,p.color,alpha*(.60+.40*p.z)*edgeFade,i%8===0);
  }
  cakeLettering(yaw,alpha);
  ctx.restore();
  ctx.globalAlpha=alpha;
  const top=ctx.createLinearGradient(-.72,-.66,.75,-.19);
  top.addColorStop(0,'#36439c');top.addColorStop(.48,'#794f9f');top.addColorStop(1,'#3263a9');
  ellipse(0,cakeTop,1.016,viewTilt,'#e8e9ff');
  ellipse(0,cakeTop,.956,viewTilt*.87,top);
  for(let i=0;i<150;i++){
    const p=ornaments[i];
    const radius=i<102?.89+p.y*.111:Math.sqrt(p.y)*.88;
    const point=cakePoint(p.x*tau+yaw,radius,cakeTop-.009);
    const color=i%6===0?'#fffaff':p.color;
    cakeCandy(point.x,point.y,.005+p.size**2*.037,color,alpha*(.76+.24*p.z),i%7===0);
  }
  ctx.globalAlpha=alpha;
  const candle=ctx.createLinearGradient(-.047,0,.047,0);
  candle.addColorStop(0,'#7898db');candle.addColorStop(.52,'#fff7ff');candle.addColorStop(1,'#c692e5');
  ctx.fillStyle=candle;ctx.beginPath();ctx.roundRect(-.043,-1.24,.086,.85,.028);ctx.fill();
  ctx.fillStyle='#5f4058';ctx.fillRect(-.009,-1.31,.018,.09);
  if(!extinguished){
    const flicker=reduced?0:Math.sin(time*12)*.026+Math.sin(time*7)*.017;
    glow(flicker,-1.56,.59,colors[3],.82*alpha);
    ctx.globalAlpha=alpha;
    const flame=ctx.createLinearGradient(0,-1.92,0,-1.28);
    flame.addColorStop(0,'#f6faff');flame.addColorStop(.58,'#fff8e9');flame.addColorStop(1,'#ffa64c');
    ctx.fillStyle=flame;ctx.beginPath();ctx.moveTo(flicker,-1.93);
    ctx.bezierCurveTo(.025,-1.69,.26,-1.35,.065,-1.29);
    ctx.bezierCurveTo(-.22,-1.21,-.10,-1.64,flicker,-1.93);ctx.fill();
    ellipse(0,-1.36,.034,.074,'#fff');
  }else if(time-extinguished<1.1){
    const q=time-extinguished;
    for(let i=0;i<12;i++){
      const m=q+i*.034;
      glow(Math.sin(m*9)*.075,-1.29-m*.48,.10+m*.03,colors[0],.12*(1-q/1.1)*alpha);
    }
  }
  orbitShapes(time,true,alpha);
  // Decorations follow depth and size variations instead of a regular grid.
  for(let i=0;i<135;i++){
    const p=ornaments[i], a=p.x*tau, radius=Math.sqrt(p.y)*1.27;
    const drift=reduced?0:Math.sin(time*(.35+p.z*.7)+p.phase)*.025;
    const px=Math.cos(a)*radius+drift,py=-.63+Math.sin(a)*radius*.99;
    const strong=i%6===0;
    if(strong)glow(px,py,.10+p.size*.14,p.color,.86*alpha);
    ctx.globalAlpha=alpha*(.55+.45*p.z);
    const size=strong?.029+p.size*.043:.003+p.size*.017;
    if(i%4===0){
      ctx.fillStyle=p.color;ctx.beginPath();
      for(let j=0;j<10;j++){
        const a=j*tau/10-Math.PI/2,rr=j%2?size*.42:size;
        if(j)ctx.lineTo(px+rr*Math.cos(a),py+rr*Math.sin(a));
        else ctx.moveTo(px+rr*Math.cos(a),py+rr*Math.sin(a));
      }
      ctx.closePath();ctx.fill();
    }else{ellipse(px,py,size,size,p.color);}
  }
  ctx.restore();ctx.globalAlpha=1;
}

// Starflow-inspired movement: layered spiral paths, inward travel, tapered ends and rare bright stars.
function galaxy(time,progress=1,finale=false){
  const {x,y,r}=layout();
  const size=finale?Math.min(width*.48,height*.44):r*1.78;
  const centerY=finale?height*.52:y+r*.67;
  const twist=reduced?0:time*.095*settings.orbitSpeed;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<stars.length;i++){
    const p=stars[i];
    const drift=reduced?0:time*(.055+.013*p.arm);
    const u=(p.travel+12-drift%1)%1;
    const taper=Math.sin(Math.PI*u);
    const angle=p.arm*tau/5+u*5.9+twist+p.offset*.38*taper;
    const radius=(.055+u*.93)*size;
    const targetX=x+Math.cos(angle)*radius;
    const targetY=centerY+Math.sin(angle)*radius*(finale?.51:.19)+p.offset*size*.047*taper;
    const startX=i%2&&cardBox?cardBox.left+p.ox*cardBox.width:x+(p.ox-.5)*r*2.35;
    const startY=i%2&&cardBox?cardBox.top+p.oy*cardBox.height:y+(p.oy-.7)*r*2.5;
    const delay=(p.phase/tau)*.25;
    const q=smooth((progress-delay)/(1-delay));
    const bend=Math.sin(q*Math.PI)*r*.7;
    const px=lerp(startX,targetX,q)+Math.cos(p.phase)*bend;
    const py=lerp(startY,targetY,q)+Math.sin(p.phase)*bend*.58;
    const bright=p.size>.937;
    const alpha=(.24+.72*taper)*(.68+.32*Math.sin(time*2.2+p.phase));
    if(bright)glow(px,py,(finale?12:8)+p.size*4,p.color,alpha*.8);
    sparkle(px,py,bright?1.6+p.offset:.36+p.size*.68,p.color,alpha*(finale?1:.63),bright&&i%3===0?1:0);
  }
  if(finale)glow(x,centerY,Math.min(size*.42,150),colors[0],.73*smooth(progress));
  ctx.restore();ctx.globalAlpha=1;
}

function stopMic(){
  micRequest++;
  cancelAnimationFrame(micFrame);
  stream?.getTracks().forEach(track=>track.stop());stream=null;
  if(micAudio){micAudio.close().catch(()=>{});micAudio=null;}
}
function setStage(next,now=performance.now()){
  stage=next;started=now;
  for(const [id,visible] of Object.entries({invite:next==='invite',counter:next==='countdown',cakeTitle:next==='cake',wish:next==='cake',card:next==='card',end:next==='end'})){
    byId(id).hidden=!visible;
  }
  if(next==='cake'){
    cakeRevealedAt=now/1000;
    byId('micStatus').textContent='许个愿，再吹灭蜡烛。';
  }
  if(next==='gather'||next==='end'||next==='invite')stopMic();
}
function frame(now){
  const time=now/1000,elapsed=(now-started)/1000;
  if(stage==='countdown'){
    const count=3-Math.floor(elapsed);
    if(count>0&&count!==lastNumber){lastNumber=count;byId('counter').textContent=count;}
    if(count<=0)setStage('cake',now);
  }else if(stage==='smoke'&&elapsed>.62){setStage('card',now);}
  else if(stage==='card'&&elapsed>12){gather();}
  else if(stage==='gather'&&elapsed>(reduced?1.3:6.4)){setStage('end',now);}

  ctx.clearRect(0,0,width,height);background(time);
  if(stage==='invite'||stage==='countdown')galaxy(time);
  if(stage==='cake'||stage==='card'||stage==='smoke'){galaxy(time);drawCake(time);}
  if(stage==='gather'){
    const progress=clamp(elapsed/(reduced?.75:2.7));
    if(progress<.7)drawCake(time,1-smooth(progress/.7));
    galaxy(time,progress,true);
  }
  if(stage==='end')galaxy(time,1,true);
  raf=requestAnimationFrame(frame);
}
function extinguish(){
  if(stage!=='cake')return;
  extinguished=performance.now()/1000;stopMic();playTone(432,.28,.05);
  setStage('smoke');
}
function gather(){
  if(stage!=='card')return;
  cardBox=byId('card').getBoundingClientRect();setStage('gather');
  playTone(660,.45,.04);
}
function playTone(freq,duration,volume){
  if(!musicOn||!audioCtx||audioCtx.state!=='running')return;
  const oscillator=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;
  oscillator.type='sine';oscillator.frequency.value=freq;
  gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.055);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  oscillator.connect(gain).connect(audioCtx.destination);oscillator.start(now);oscillator.stop(now+duration);
}
async function toggleMusic(){
  musicOn=!musicOn;
  try{
    if(musicOn&&song)await song.play();
    else if(song)song.pause();
    else if(musicOn){
      audioCtx??=new AudioContext();await audioCtx.resume();
      let index=0;const notes=[261.63,329.63,392,523.25,293.66,440,392,329.63];
      playTone(notes[index++],.7,.034);
      noteTimer=setInterval(()=>playTone(notes[index++%notes.length],.7,.034),690);
    }else{clearInterval(noteTimer);}
  }catch{musicOn=false;clearInterval(noteTimer);}
  byId('music').setAttribute('aria-pressed',String(musicOn));
  byId('music').textContent=musicOn?'关闭音乐':'开启音乐';
}
async function listenForBlow(){
  if(stage!=='cake'||stream)return;
  const request=++micRequest, status=byId('micStatus');
  byId('blow').disabled=true;status.textContent='正在等待麦克风授权…';
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('microphone unavailable');
    const input=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
    if(request!==micRequest||stage!=='cake'){input.getTracks().forEach(track=>track.stop());return;}
    stream=input;micAudio=new AudioContext();await micAudio.resume();
    if(request!==micRequest||stage!=='cake')return;
    const analyser=micAudio.createAnalyser();analyser.fftSize=1024;
    micAudio.createMediaStreamSource(input).connect(analyser);
    const signal=new Float32Array(analyser.fftSize), freq=new Uint8Array(analyser.frequencyBinCount);
    const calibratedAt=performance.now();let noise=0,samples=0,held=0,last=calibratedAt;
    status.textContent='请稍等，正在检测环境音…';
    function measure(now){
      if(stage!=='cake'||request!==micRequest)return;
      analyser.getFloatTimeDomainData(signal);analyser.getByteFrequencyData(freq);
      let energy=0,low=0,mid=0;
      for(const value of signal)energy+=value*value;
      const rms=Math.sqrt(energy/signal.length);
      const step=micAudio.sampleRate/analyser.fftSize;
      for(let k=Math.ceil(180/step);k<Math.ceil(2400/step);k++){
        if(k*step<480)low+=freq[k];else mid+=freq[k];
      }
      const dt=Math.min(40,now-last);last=now;
      if(now-calibratedAt<720){noise+=rms;samples++;}
      else{
        if(status.textContent!=='对着麦克风吹气，或点一下许愿。')status.textContent='对着麦克风吹气，或点一下许愿。';
        const enough=rms>Math.max(.026,noise/Math.max(1,samples)*2.8)&&mid>low*.72;
        held=enough?held+dt:Math.max(0,held-dt*2);
        if(held>250){extinguish();return;}
      }
      micFrame=requestAnimationFrame(measure);
    }
    micFrame=requestAnimationFrame(measure);
  }catch{
    if(request===micRequest){stopMic();status.textContent='麦克风暂不可用，可以点一下许愿。';}
  }finally{byId('blow').disabled=false;}
}
byId('invite').addEventListener('submit',event=>{
  event.preventDefault();
  const valid=Number(byId('month').value)===settings.month&&Number(byId('day').value)===settings.day;
  byId('error').hidden=valid;
  if(valid){extinguished=0;lastNumber=3;byId('counter').textContent='3';setStage('countdown');}
});
byId('tap').onclick=extinguish;
byId('blow').onclick=listenForBlow;
byId('stars').onclick=gather;
byId('music').onclick=toggleMusic;
byId('replay').onclick=()=>{
  extinguished=0;cardBox=null;lastNumber=3;
  byId('counter').textContent='3';setStage('countdown');
};
addEventListener('resize',resize);
addEventListener('pagehide',()=>{stopMic();cancelAnimationFrame(raf);clearInterval(noteTimer);song?.pause();});
addEventListener('pageshow',event=>{
  if(event.persisted){resize();musicOn=false;byId('music').textContent='开启音乐';byId('music').setAttribute('aria-pressed','false');raf=requestAnimationFrame(frame);}
});
resize();raf=requestAnimationFrame(frame);
</script>
